name: MetalVoice2 v2.0 release

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

jobs:
  build:
    if: github.event.number == 3 && (github.event.action != 'closed' || github.event.pull_request.merged)
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - name: Build and verify release downloads
        run: |
          test "$(plutil -extract MVReleaseVersion raw Resources/Info.plist)" = 2.0
          bash scripts/package_release.sh
      - name: Attach downloads to this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MetalVoice2-v2.0-macOS-arm64
          path: |
            build/release/MetalVoice2-v2.0-macOS-arm64.zip
            build/release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    if: github.event.action == 'closed' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: publish-metalvoice2-v2
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MetalVoice2-v2.0-macOS-arm64
      - name: Publish v2.0 from the merge commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          tag=v2.0
          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq '.[].ref')
          if grep -Fxq "refs/tags/$tag" <<< "$refs"; then
            test "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" = "$MERGE_COMMIT"
          fi
          if release=$(gh release view "$tag" --json isDraft,targetCommitish); then
            if [[ $(jq -r .isDraft <<< "$release") == false ]]; then
              test "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" = "$MERGE_COMMIT"
              exit 0
            fi
            test "$(jq -r .targetCommitish <<< "$release")" = "$MERGE_COMMIT"
          else
            gh release create "$tag" --draft --target "$MERGE_COMMIT" --title "MetalVoice2 v2.0" \
              --notes "MetalVoice2 now follows macOS microphone changes and includes the Voice Changer panel. Download the Apple Silicon app ZIP for macOS 15 or later. Voice Changer prepares its dependencies automatically on first use."
          fi
          gh release upload "$tag" MetalVoice2-v2.0-macOS-arm64.zip SHA256SUMS --clobber
          gh release edit "$tag" --draft=false --latest
